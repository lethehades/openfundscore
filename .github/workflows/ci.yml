name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate packaged research resources
        run: |
          python -m openfundscore.cli resources list
          python -m openfundscore.cli resources resolve \
            --type scoring-config --name openfundscore-core --version 0.1.0
          python -m openfundscore.cli resources show \
            --type scoring-config --name openfundscore-core --version 0.1.0 \
            > "${RUNNER_TEMP}/openfundscore-core-0.1.0.json"
          python -m openfundscore.cli validate-config \
            "${RUNNER_TEMP}/openfundscore-core-0.1.0.json"
