[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfundscore"
version = "0.2.0.dev0"
description = "Open, auditable and category-aware fund research and scoring framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format-nongpl]>=4.18,<5"]
license = {text = "Apache-2.0"}
authors = [{name = "lethehades"}]
keywords = ["funds", "quantitative-finance", "scoring", "research"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[project.scripts]
openfundscore = "openfundscore.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openfundscore._resources" = [
  "index.json",
  "schema/*/*.json",
  "scoring-config/*/*.json",
  "strategy-mapping/*/*.json",
  "platform-boundary/*/*.json",
]
